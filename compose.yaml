# Local stack.
#
#   docker compose up -d                 # Postgres + RustFS for `mix phx.server`
#   docker compose --profile app up -d   # + two clustered Akvy instances behind the same DB/S3
#
# The instances listen on http://localhost:4000 and http://localhost:4001. They migrate
# the database on boot (serialized by an advisory lock) and join an Erlang cluster
# discovered through Postgres.
name: akvy

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["${RUSTFS_PORT:-9000}:9000", "${RUSTFS_CONSOLE_PORT:-9001}:9001"]
    volumes: [rustfs:/data]

  akvy-1:
    profiles: [app]
    image: akvy:local
    build: .
    environment: &akvy-env
      DATABASE_URL: ecto://postgres:postgres@postgres/akvy
      SECRET_KEY_BASE: dev-only-secret-key-base-change-me-dev-only-secret-key-base-change-me
      # Same cookie on every node: required to form the Erlang cluster.
      RELEASE_COOKIE: dev-only-cluster-cookie-change-me
      PHX_HOST: localhost
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: akvy
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      FFMPEG_CONCURRENCY: "2"
      INSTANCE_NAME: akvy-1
    ports: ["4000:4000"]
    # Graceful shutdown budget, see SHUTDOWN_* variables.
    stop_grace_period: 60s
    depends_on: &akvy-deps
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }

  akvy-2:
    profiles: [app]
    image: akvy:local
    build: .
    environment:
      <<: *akvy-env
      INSTANCE_NAME: akvy-2
    ports: ["4001:4000"]
    stop_grace_period: 60s
    depends_on: *akvy-deps

volumes:
  postgres:
  rustfs:
